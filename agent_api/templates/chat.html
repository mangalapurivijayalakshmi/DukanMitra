<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DukanMitra</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 12px; background:#f5f5f5; }
  h2 { text-align:center; }
  #log { background:#fff; height:60vh; overflow-y:auto; padding:10px; border-radius:8px; }
  .me { text-align:right; color:#0b5; margin:8px 0; }
  .bot { text-align:left; margin:8px 0; white-space:pre-wrap; }
  #row { display:flex; gap:6px; margin-top:8px; }
  #msg { flex:1; padding:10px; font-size:16px; }
  button { padding:10px 14px; font-size:16px; cursor:pointer; }
  #mic { background:#e33; color:#fff; border:none; border-radius:50%; width:48px; height:48px; }
</style>
</head>
<body>
<h2>🛒 DukanMitra</h2>
<div id="log"></div>
<div id="row">
  <input id="msg" placeholder="తెలుగులో అడగండి...">
  <button id="mic" title="మాట్లాడండి">🎤</button>
  <button id="send">పంపు</button>
</div>
<script>
const sid = "s" + Math.random().toString(36).slice(2);
const log = document.getElementById("log");
const msg = document.getElementById("msg");

function add(cls, text) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function send() {
  const text = msg.value.trim();
  if (!text) return;
  add("me", text); msg.value = "";
  add("bot", "...");
  const r = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: sid, message: text})
  });
  const data = await r.json();
  log.lastChild.textContent = data.reply;
  speechSynthesis.speak(new SpeechSynthesisUtterance(data.reply.replace(/[*#]/g, "")));
}

document.getElementById("send").onclick = send;
msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = "te-IN";
  rec.onresult = e => { msg.value = e.results[0][0].transcript; send(); };
  document.getElementById("mic").onclick = () => rec.start();
} else {
  document.getElementById("mic").style.display = "none";
}
</script>
</body>
</html>
